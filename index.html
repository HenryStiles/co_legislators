<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Colorado Legislative District Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0 1.5em;
            background-color: #f4f6f8;
            color: #1e293b;
        }

        /* Top Sticky Header with Search */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 99999;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin: 12px 0 24px 0;
            padding: 12px 20px;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .brand h1 {
            font-size: 1.35em;
            margin: 0;
            color: #0f172a;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .brand p {
            margin: 2px 0 0 0;
            font-size: 0.85em;
            color: #64748b;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            flex: 1;
            min-width: 280px;
            max-width: 520px;
            z-index: 100000;
        }
        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            pointer-events: none;
        }
        #legislator-search {
            width: 100%;
            height: 42px;
            padding: 0 38px 0 40px;
            border: 1.5px solid #cbd5e1;
            border-radius: 22px;
            font-size: 14px;
            color: #1e293b;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }
        #legislator-search:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        #legislator-search::placeholder {
            color: #94a3b8;
        }
        .search-clear-btn {
            position: absolute;
            right: 12px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: #cbd5e1;
            color: #475569;
            font-size: 14px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .search-clear-btn:hover {
            background: #94a3b8;
            color: #ffffff;
        }

        /* Search Results Dropdown */
        .search-results-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            max-height: 420px;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.08);
            z-index: 100001;
            display: none;
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-item:hover,
        .search-result-item.selected {
            background-color: #eff6ff;
        }
        .result-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #cbd5e1;
            background: #e2e8f0;
            flex-shrink: 0;
        }
        .result-avatar-fallback {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }
        .result-info {
            flex: 1;
            min-width: 0;
        }
        .result-name {
            font-size: 14.5px;
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-badges {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 11.5px;
            font-weight: 500;
            padding: 1.5px 7px;
            border-radius: 10px;
            display: inline-block;
        }
        .badge-senate {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .badge-house {
            background: #f8fafc;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
        .badge-dem {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .badge-rep {
            background: #fee2e2;
            color: #b91c1c;
        }
        .badge-notice {
            background: #fef3c7;
            color: #92400e;
        }
        .result-counties {
            font-size: 11.5px;
            color: #64748b;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-no-results {
            padding: 18px 16px;
            text-align: center;
            color: #64748b;
            font-size: 13.5px;
        }

        /* Nav links */
        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn {
            font-size: 13px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 20px;
            background: #f1f5f9;
            color: #334155;
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: #2563eb;
            color: #ffffff;
        }

        /* Map Section Wrappers */
        .map-wrapper {
            background: #ffffff;
            padding: 1.25em 1.5em 1.5em 1.5em;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            margin-bottom: 2em;
            scroll-margin-top: 95px;
        }
        .map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .map-title {
            font-size: 1.8em;
            margin: 0;
            color: #0f172a;
            font-weight: 700;
        }
        .map-subtitle {
            font-size: 0.9em;
            color: #64748b;
            margin-top: 2px;
        }
        .map-divider {
            margin: 36px 0;
            border: none;
            height: 1px;
            background: #e2e8f0;
        }
        #map, #house-map {
            height: 620px;
            width: 100%;
            position: relative;
            z-index: 10;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        /* Map Labels */
        .district-label {
            font-weight: bold;
            font-size: 12px;
            color: #0f172a;
            text-shadow: 1px 1px 2px #ffffff, -1px -1px 2px #ffffff, 1px -1px 2px #ffffff, -1px 1px 2px #ffffff;
            text-align: center;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            body { padding: 0 0.8em; }
            .header-content { flex-direction: column; align-items: stretch; }
            .search-container { max-width: 100%; min-width: auto; }
            #map, #house-map { height: 480px; }
            .map-title { font-size: 1.4em; }
        }
    </style>
</head>
<body id="top">
    <!-- Sticky Navigation & Search Header -->
    <header class="app-header">
        <div class="header-content">
            <div class="brand">
                <h1>Colorado Legislative District Maps</h1>
                <p>Interactive visualization of Senate &amp; House districts</p>
            </div>
            
            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input 
                        type="search" 
                        id="legislator-search" 
                        placeholder="Search legislators by name, district, or county..." 
                        autocomplete="off" 
                        spellcheck="false"
                        aria-label="Search legislators"
                    >
                    <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Clear search">&times;</button>
                </div>
                <div id="search-results-dropdown" class="search-results-dropdown" role="listbox"></div>
            </div>

            <nav class="header-nav">
                <a href="#senate-section" class="nav-btn">Senate (35)</a>
                <a href="#house-section" class="nav-btn">House (65)</a>
            </nav>
        </div>
    </header>

    <!-- Colorado Senate Map Section -->
    <section id="senate-section" class="map-wrapper">
        <div class="map-header">
            <div>
                <h2 class="map-title">Colorado Senate Districts</h2>
                <div class="map-subtitle">35 districts &mdash; 2021 redistricting boundaries</div>
            </div>
            <a href="#house-section" class="nav-btn">Jump to House Map &darr;</a>
        </div>
        <div id="map"></div>
    </section>

    <hr class="map-divider">

    <!-- Colorado House Map Section -->
    <section id="house-section" class="map-wrapper">
        <div class="map-header">
            <div>
                <h2 class="map-title">Colorado House Districts</h2>
                <div class="map-subtitle">65 districts &mdash; 2021 redistricting boundaries</div>
            </div>
            <a href="#senate-section" class="nav-btn">&uarr; Back to Senate Map</a>
        </div>
        <div id="house-map"></div>
    </section>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="main.js?v=2.5"></script>
</body>
</html>
